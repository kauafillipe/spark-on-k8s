apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  image: "docker.io/kaufirs/spark-poc:pi-3.5.3"
  imagePullPolicy: Always
  imagePullSecrets:
    - dockerhub-credentials
  mainApplicationFile: "local:///opt/spark/examples/src/main/python/pi.py"
  sparkVersion: "3.5.3"
  sparkConf:
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "file:///spark-event-logs"
  volumes:
    - name: event-logs
      hostPath:
        path: /spark-event-logs
        type: Directory
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.3
    serviceAccount: spark-operator-spark
    volumeMounts:
      - name: event-logs
        mountPath: /spark-event-logs
  executor:
    instances: 1
    cores: 1
    memory: "512m"
    labels:
      version: 3.5.3
